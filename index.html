<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasky Application</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #f5f7fa; /* Light Gray */
        color: #333; /* Dark Gray */
      }
      .navbar-custom {
        background-color: #4a90e2; /* Blue */
      }
      .addNewItemBtnForMobile {
        position: fixed;
        bottom: 0;
        right: 0;
        margin-bottom: 15px;
        margin-right: 15px;
        display: none;
      }
      .modal-content {
        background-color: #ffffff; /* White */
      }
      .btn-primary {
        background-color: #f39c12; /* Orange */
        border-color: #f39c12; /* Orange */
      }
      .btn-primary:hover {
        background-color: #d68a0a; /* Darker Orange */
        border-color: #d68a0a; /* Darker Orange */
      }
      .taskCard {
        background-color: #ffffff; /* White */
      }
      .input-group-text {
        background-color: #50e3c2; /* Turquoise */
        color: #fff; /* White */
      }
      /* Navbar Animation */
      .animate-navbar {
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
      }
      .animate-navbar.sticky {
        background-color: #f8f9fa; /* Light background on scroll */
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Add shadow */
      }
      /* Search Bar Animation */
      .animate-searchbar {
        transition: transform 0.3s ease, opacity 0.3s ease;
      }
      .search-input {
        transition: transform 0.3s ease;
      }
      .search-input:focus {
        transform: scale(1.05); /* Slight enlargement on focus */
        outline: none; /* Remove outline */
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.2); /* Add shadow */
      }
      /* Search Button Animation */
      .input-group-text {
        transition: transform 0.3s ease;
      }
      .input-group-text:hover {
        transform: scale(1.1); /* Slight enlargement on hover */
        cursor: pointer; /* Change cursor to pointer */
      }
      /* Add Item Button Animation */
      .btn-add-item {
        transition: transform 0.3s ease, background-color 0.3s ease;
      }
      .btn-add-item:hover {
        transform: scale(1.05); /* Slight enlargement on hover */
        background-color: #d68a0a; /* Darker Orange */
      }
      /* Scroll Animation */
      .scroll-animation {
        animation: bounce 0.5s ease forwards;
      }
      @keyframes bounce {
        0%, 20%, 50%, 80%, 100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-10px);
        }
        60% {
          transform: translateY(-5px);
        }
      }
      @media (max-width: 992px) {
        .addNewItemBtnForMobile {
          display: flex;
          background-color: white;
        }
      }
    </style>
  </head>
  <body onload="loadIntialData()">
    <!-- Btn for mobile size -->
    <div class="addNewItemBtnForMobile z-3">
      <button
        class="btn btn-outline-primary d-flex align-items-center gap-3 btn-add-item"
        type="submit"
        data-bs-toggle="modal"
        data-bs-target="#addTaskModal"
        id="addItemButton"
      >
        <i class="fa-solid fa-plus mr-5"></i> Add Item
      </button>
    </div>
    <!-- Modal -->
    <div
      class="modal fade"
      id="addTaskModal"
      tabindex="-1"
      aria-labelledby="addTaskModalLable"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">
              Add New Task
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form onsubmit="return false" id="form">
              <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Img Url</label>
                <input
                  type="url"
                  class="form-control"
                  id="imageUrl"
                  aria-describedby="emailHelp"
                  placeholder="https://krunal.com/img.png"
                />
                <div id="emailHelp" class="form-text">
                  Enter Valid Img Source
                </div>
              </div>
              <div class="mb-3">
                <label for="enterTaskTitle" class="form-label">Task Title</label>
                <input
                  type="text"
                  class="form-control"
                  id="enterTaskTitle"
                  aria-describedby="TaskTitle"
                  placeholder="Enter Task Title"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="taskType" class="form-label">Task Type</label>
                <input
                  type="text"
                  class="form-control"
                  id="taskType"
                  aria-describedby="TaskType"
                  placeholder="Enter Task Type"
                />
              </div>
              <div class="mb-3">
                <label for="taskDescription" class="form-label">Task Description</label>
                <textarea
                  type="text"
                  class="form-control"
                  id="taskDescription"
                  aria-describedby="TaskDescription"
                  placeholder="Enter Task Description"
                  required
                ></textarea>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              id="submitButton"
              type="button"
              class="btn btn-primary"
              data-bs-dismiss="modal"
              aria-label="Close"
              onclick="handleSubmit()"
            >
              Add Task
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Open Task Modal -->
    <div
      class="modal fade"
      id="OpenTaskModal"
      tabindex="-1"
      aria-labelledby="OPenModal"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Task</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body taskModalBody">...</div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
     </div>
    </div>

    <!-- NavBar -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top animate-navbar">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Tasky Application</a>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#"></a>
            </li>
          </ul>
          <button
            class="btn d-flex align-items-center gap-3 btn-add-item"
            type="submit"
            data-bs-toggle="modal"
            data-bs-target="#addTaskModal"
            id="addItemButtonNav"
          >
            <i class="fa-solid fa-plus mr-5"></i> Add Item
          </button>
        </div>
      </div>
    </nav>

    <div class="container">
      <section class="mt-5 sticky-top animate-searchbar">
        <div class="row justify-content-center">
          <div class="col-md-6 mt-2">
            <div class="input-group flex-nowrap shadow-lg rounded">
              <input
                type="search"
                class="form-control search-input"
                placeholder="search your task here.."
                aria-label="Search Task"
                aria-describedby="addon-wrapping"
                oninput="searchTask.apply(this, arguments)"
              />
              <span class="input-group-text" id="addon-wrapping">
                <i class="fa-sharp fa-solid fa-magnifying-glass"></i>
              </span>
            </div>
          </div>
        </div>
      </section>

      <!-- card section -->
      <section class="mt-3">
        <div class="row taskContent overflow-auto h-auto"></div>
      </section>
    </div>

    <!-- Scripts -->
    <script src="./js folder/index.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
      integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
      crossorigin="anonymous"
    ></script>
    <script>
      window.addEventListener('scroll', function() {
        const addItemButton = document.getElementById('addItemButton');
        const addItemButtonNav = document.getElementById('addItemButtonNav');
        if (window.scrollY > 50) {
          addItemButton.classList.add('scroll-animation');
          addItemButtonNav.classList.add('scroll-animation');
        } else {
          addItemButton.classList.remove('scroll-animation');
          addItemButtonNav.classList.remove('scroll-animation');
        }
      });
    </script>
  </body>
</html>
